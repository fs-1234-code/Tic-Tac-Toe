<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe | TOP</title>
  <link rel="stylesheet" href="./styles/main.css">
  <script src="./scripts/script.js"></script>
</head>
<body>
  <div class="container">
    <section class="game_header">
      <h1>Tic Tac Toe</h1>
      <div class="scoreboard">
        <div class="left_hand">
          <span class="left_marker"></span>
          <span class="left_score"></span>
        </div>
        <div class="right_hand">
          <span class="right_marker"></span>
          <span class="right_score"></span>
        </div>
      </div>
    </section>

    <section class="game_content">
      <div class="playboard">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div class="controls">
        <button type="button">Reset</button>
      </div>
    </section>

    <footer>
      <p class="credit">This is a test project as an assignment given by 
      The Odin Project course.</p>
      <p class="copyright">&copy; Designed & Coded by Falcon.</p>
    </footer>
  </div>
</body>
</html>
